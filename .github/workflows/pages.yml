name: Publicar Piter Apps
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: piter-apps-pages
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar GitHub Releases y preparar la web
        run: node scripts/release-check.mjs
        env:
          PITER_COMMENTS_ENDPOINT: ${{ vars.PITER_COMMENTS_ENDPOINT }}
          PITER_TURNSTILE_SITEKEY: ${{ vars.PITER_TURNSTILE_SITEKEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
